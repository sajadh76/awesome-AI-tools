<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20">
  <circle cx="10" cy="10" r="5" fill="#00C853">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="10" cy="10" r="5" fill="none" stroke="#00C853" stroke-width="2">
    <animate attributeName="r" values="5;9.5" dur="1.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0" dur="1.4s" repeatCount="indefinite"/>
  </circle>
</svg>
