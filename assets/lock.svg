<svg xmlns="http://www.w3.org/2000/svg" width="20" height="22" viewBox="0 0 20 22">
  <!-- shackle: closes (locked), then lifts and swings open (unlocked) -->
  <path d="M6 10 V6.5 A4 4 0 0 1 14 6.5 V10" fill="none" stroke="#90A4AE" stroke-width="2.4" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -3;0 -3;0 0" keyTimes="0;0.35;0.5;0.85;1" dur="2.4s" repeatCount="indefinite" additive="sum"/>
    <animateTransform attributeName="transform" type="rotate" values="0 14 7;0 14 7;0 14 7;-35 14 7;-35 14 7;0 14 7;0 14 7" keyTimes="0;0.35;0.5;0.6;0.8;0.9;1" dur="2.4s" repeatCount="indefinite" additive="sum"/>
  </path>
  <!-- body -->
  <rect x="3" y="9.5" width="14" height="11" rx="2.5" fill="#FFC107" stroke="#E0A800" stroke-width="0.8"/>
  <!-- keyhole changes colour: red when locked, green when open -->
  <circle cx="10" cy="14" r="1.6">
    <animate attributeName="fill" values="#E53935;#E53935;#00C853;#00C853;#E53935" keyTimes="0;0.45;0.55;0.9;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <rect x="9.3" y="14.5" width="1.4" height="3" rx="0.6">
    <animate attributeName="fill" values="#E53935;#E53935;#00C853;#00C853;#E53935" keyTimes="0;0.45;0.55;0.9;1" dur="2.4s" repeatCount="indefinite"/>
  </rect>
</svg>
