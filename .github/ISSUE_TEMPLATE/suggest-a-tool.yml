name: Suggest a tool
description: Propose an AI tool to add to the list
labels: ["suggestion"]
body:
  - type: input
    id: name
    attributes:
      label: Tool name
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Link
      placeholder: https://
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Short description
      description: One or two sentences about what the tool does.
    validations:
      required: true
  - type: input
    id: category
    attributes:
      label: Category
      description: An existing category, or a new one you'd like to propose.
