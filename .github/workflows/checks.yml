name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  awesome-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run awesome-lint
        # The "GitHub topic" rule checks repository settings, not the README, so it is skipped.
        # Every other awesome-lint rule still fails the check.
        run: |
          out=$(npx --yes awesome-lint README.md 2>&1) && exit 0
          echo "$out"
          # Fail on any rule error except the topic rule (each error line names its remark-lint rule).
          if echo "$out" | grep 'remark-lint:' | grep -v 'as a GitHub topic' | grep -q .; then
            exit 1
          fi
          # Fail if awesome-lint crashed without reporting any rule errors.
          echo "$out" | grep -q 'as a GitHub topic' || exit 1

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Only links being added are checked: on a PR, the links the PR adds;
      # on a push to main, the links that push adds. Existing entries are never re-checked.
      - name: Collect added links
        id: added
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No base commit to compare with; nothing to check."
            : > added-links.txt
          else
            git diff --unified=0 "$BASE" HEAD -- README.md CONTRIBUTING.md \
              | grep '^+' | grep -v '^+++' \
              | grep -oE 'https?://[^ )>"]+' | sort -u > added-links.txt || true
          fi
          echo "Links added:"; cat added-links.txt
          echo "count=$(wc -l < added-links.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Check added links
        if: steps.added.outputs.count != '0'
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --accept 200,206,401,403,429
            --exclude 'gemini\.google\.com'
            added-links.txt
          fail: true
