name: Checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly link check
  workflow_dispatch:

permissions:
  contents: read

jobs:
  awesome-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run awesome-lint
        # The "GitHub topic" rule checks repository settings, not the README, so it is skipped.
        # Every other awesome-lint rule still fails the check.
        run: |
          out=$(npx --yes awesome-lint README.md 2>&1) || true
          echo "$out"
          if echo "$out" | grep '✖' | grep -v 'as a GitHub topic' | grep -q .; then
            exit 1
          fi

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --accept 200,206,401,403,429
            --exclude 'gemini\.google\.com'
            README.md CONTRIBUTING.md
          fail: true
