name: Checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly link check
  workflow_dispatch:

permissions:
  contents: read

jobs:
  awesome-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run awesome-lint
        # The "GitHub topic" rule checks repository settings, not the README, so it is skipped.
        # Every other awesome-lint rule still fails the check.
        run: |
          out=$(npx --yes awesome-lint README.md 2>&1) && exit 0
          echo "$out"
          # Fail on any rule error except the topic rule (each error line names its remark-lint rule).
          if echo "$out" | grep 'remark-lint:' | grep -v 'as a GitHub topic' | grep -q .; then
            exit 1
          fi
          # Fail if awesome-lint crashed without reporting any rule errors.
          echo "$out" | grep -q 'as a GitHub topic' || exit 1

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # On pull requests, only check links the PR adds, so a site that is
      # temporarily down elsewhere in the list doesn't block contributors.
      - name: Collect links added by this PR
        id: added
        if: github.event_name == 'pull_request'
        run: |
          git diff --unified=0 "origin/${{ github.base_ref }}...HEAD" -- README.md CONTRIBUTING.md \
            | grep '^+' | grep -v '^+++' \
            | grep -oE 'https?://[^ )>"]+' | sort -u > added-links.txt || true
          echo "Links added by this PR:"; cat added-links.txt
          echo "count=$(wc -l < added-links.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Check added links
        if: github.event_name == 'pull_request' && steps.added.outputs.count != '0'
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --accept 200,206,401,403,429
            --exclude 'gemini\.google\.com'
            added-links.txt
          fail: true

      # On main, weekly, and manual runs, check every link in the list.
      - name: Check all links
        if: github.event_name != 'pull_request'
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --accept 200,206,401,403,429
            --exclude 'gemini\.google\.com'
            README.md CONTRIBUTING.md
          fail: true
